name: Seed database
on:
  workflow_dispatch:
  schedule:
  # At 04:00pm daily
  - cron: "0 16 * * *"
jobs:
    seed:
        name: Seed database
        runs-on: ubuntu-22.04
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - name: Seed
              run: |
                  npm ci
                  npm run seed
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  STEAM_KEY: ${{ secrets.STEAM_KEY }}
